<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>REA 3D Neural Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #3d-graph { width: 100%; height: 100%; }

    /* HUD Header */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00f3ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0,243,255,0.4);
    }
    .hud-subtitle {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Search Bar */
    .search-box {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }
    .search-box input {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 8px;
      padding: 8px 14px;
      color: #00f3ff;
      font-family: monospace;
      font-size: 13px;
      outline: none;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
      width: 200px;
      transition: all 0.3s;
    }
    .search-box input:focus {
      width: 280px;
      border-color: #00f3ff;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }

    /* Details Panel */
    .node-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 640px;
      background: rgba(10, 15, 30, 0.95);
      border: 1px solid rgba(0, 243, 255, 0.5);
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.2);
      z-index: 20;
      transition: all 0.3s ease;
      display: none;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .panel-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      font-family: monospace;
    }
    .panel-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    /* Command editor box */
    .cmd-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cmd-input-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .cmd-input {
      flex: 1;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
      outline: none;
    }
    .cmd-input:focus {
      border-color: #00f3ff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }
    .btn-action {
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-copy { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .btn-copy:hover { background: #0ea5e9; }
    .btn-help { background: linear-gradient(135deg, #6366f1, #4f46e5); }
    .btn-help:hover { background: #818cf8; }
    .btn-exec { background: linear-gradient(135deg, #059669, #047857); }
    .btn-exec:hover { background: #10b981; }

    /* Output Console */
    .terminal-output {
      margin-top: 10px;
      background: #000000;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      color: #4ade80;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
    }

    /* Legend */
    .legend {
      position: absolute;
      left: 16px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 11px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    @media (max-width: 640px) {
      .hud-title { font-size: 16px; }
      .search-box input { width: 140px; }
      .search-box input:focus { width: 180px; }
      .legend { display: none; }
      .cmd-input-group { flex-wrap: wrap; }
      .cmd-input { width: 100%; flex: auto; }
    }
  </style>
  <!-- Dependencias locales Offline -->
  <script src="./assets/three.min.js"></script>
  <script src="./assets/3d-force-graph.min.js"></script>
</head>
<body>

  <div class="hud-header">
    <div class="hud-title">⚡ REA Neural Graph 3D</div>
    <div class="hud-subtitle">168 Herramientas de Ingeniería Inversa Activas</div>
  </div>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="Buscar comando / módulo..." autocomplete="off">
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#00f3ff"></div><span>Core & Engine</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#00ff88"></div><span>Android & ADB</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff0055"></div><span>Native & Binary</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#ffe600"></div><span>Web & JavaScript</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#b537f2"></div><span>Managed & WASM</span></div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff8800"></div><span>Agent Environments</span></div>
  </div>

  <div id="3d-graph"></div>

  <div class="node-panel" id="node-panel">
    <div class="panel-header">
      <span class="panel-title" id="panel-title">rea analyze</span>
      <span class="panel-tag" id="panel-tag" style="background:#00f3ff; color:#000;">CORE</span>
    </div>
    <div class="panel-desc" id="panel-desc">Get an overview of an app</div>
    
    <div class="cmd-container">
      <div class="cmd-input-group">
        <input type="text" class="cmd-input" id="cmd-input" value="rea analyze" placeholder="Escribe el comando o argumentos...">
        <button class="btn-action btn-copy" onclick="copyCommand()">Copiar</button>
        <button class="btn-action btn-help" onclick="triggerHelp()">--help</button>
        <button class="btn-action btn-exec" id="exec-btn" onclick="triggerExecution()">Ejecutar</button>
      </div>
      <div class="terminal-output" id="term-output"></div>
    </div>
  </div>

  <script>
    fetch('./graph-data.json')
      .then(res => res.json())
      .then(data => {
        initGraph(data);
      });

    let currentSelectedNode = null;
    let Graph = null;
    let isTabVisible = true;

    // Ahorro de batería y recursos cuando la pantalla se oculta o minimiza
    document.addEventListener('visibilitychange', () => {
      isTabVisible = !document.hidden;
      if (Graph) {
        if (!isTabVisible) {
          Graph.pauseAnimation();
        } else {
          Graph.resumeAnimation();
        }
      }
    });

    function initGraph(gData) {
      const elem = document.getElementById('3d-graph');
      Graph = ForceGraph3D()(elem)
        .graphData(gData)
        .backgroundColor('#030712')
        .nodeLabel(node => `${node.name}`)
        .nodeVal('val')
        .nodeColor(node => node.color || '#00f3ff')
        .nodeResolution(12) // Optimizado para GPU móvil
        .linkColor(link => link.color || 'rgba(0, 243, 255, 0.2)')
        .linkWidth(1)
        .linkOpacity(0.3)
        .linkDirectionalParticles(2)
        .linkDirectionalParticleWidth(1.2)
        .linkDirectionalParticleSpeed(0.004)
        .cooldownTime(4000) // Detiene el motor de física tras 4s para enfriar la CPU/batería
        .onNodeClick(node => {
          selectNode(node);
        });

      // Auto-rotación suave adaptativa
      let angle = 0;
      let isInteracting = false;
      setInterval(() => {
        if (!isInteracting && isTabVisible && Graph) {
          Graph.cameraPosition({
            x: 520 * Math.sin(angle),
            z: 520 * Math.cos(angle)
          });
          angle += Math.PI / 1500;
        }
      }, 35);

      window.addEventListener('mousedown', () => { isInteracting = true; });
      window.addEventListener('mouseup', () => { setTimeout(() => { isInteracting = false; }, 4000); });
      window.addEventListener('touchstart', () => { isInteracting = true; });
      window.addEventListener('touchend', () => { setTimeout(() => { isInteracting = false; }, 4000); });

      // Buscador predictivo
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        if (!val) return;
        const found = gData.nodes.find(n => n.name.toLowerCase().includes(val) || (n.desc && n.desc.toLowerCase().includes(val)));
        if (found) {
          selectNode(found);
        }
      });
    }

    function selectNode(node) {
      currentSelectedNode = node;
      const panel = document.getElementById('node-panel');
      const title = document.getElementById('panel-title');
      const tag = document.getElementById('panel-tag');
      const desc = document.getElementById('panel-desc');
      const cmdInput = document.getElementById('cmd-input');
      const termOutput = document.getElementById('term-output');

      termOutput.style.display = 'none';
      termOutput.innerText = '';

      panel.style.display = 'block';
      title.innerText = node.name;
      tag.innerText = node.category || 'NODE';
      tag.style.backgroundColor = node.color || '#00f3ff';
      desc.innerText = node.desc || 'Sin descripción';

      if (node.isCluster) {
        cmdInput.value = "rea --help";
        cmdInput.disabled = true;
        document.getElementById("exec-btn").disabled = true;
        document.querySelector(".btn-copy").style.display = "none";
        document.querySelector(".btn-help").style.display = "none";
      } else {
        cmdInput.value = node.cmd || `rea ${node.id}`;
        cmdInput.disabled = false;
        document.getElementById("exec-btn").disabled = false;
        document.querySelector(".btn-copy").style.display = "inline-block";
        document.querySelector(".btn-help").style.display = "inline-block";
      }

      // Enfocar cámara 3D
      const distance = 140;
      const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
      Graph.cameraPosition(
        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
        node,
        1400
      );
    }

    function copyCommand() {
      const text = document.getElementById('cmd-input').value;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.innerText = '¡Copiado!';
        setTimeout(() => { btn.innerText = 'Copiar'; }, 1500);
      });
    }

    function triggerHelp() {
      const cmdInput = document.getElementById('cmd-input');
      const baseCmd = cmdInput.value.split(' ')[0] + ' ' + (cmdInput.value.split(' ')[1] || '');
      cmdInput.value = baseCmd.trim() + ' --help';
      triggerExecution();
    }

    function triggerExecution() {
      const text = document.getElementById('cmd-input').value.trim();
      const outputElem = document.getElementById('term-output');
      const execBtn = document.getElementById('exec-btn');

      outputElem.style.display = 'block';
      outputElem.innerText = `⏳ Ejecutando en Termux: ${text}...`;
      execBtn.disabled = true;
      execBtn.innerText = 'Corriendo...';

      fetch(`/run?cmd=${encodeURIComponent(text)}`)
        .then(r => r.json())
        .then(d => {
          outputElem.innerText = d.output || 'Ejecutado sin salida.';
        })
        .catch(err => {
          outputElem.innerText = '❌ Error de comunicación con el servidor Termux: ' + err.message;
        })
        .finally(() => {
          execBtn.disabled = false;
          execBtn.innerText = 'Ejecutar';
        });
    }
  </script>
</body>
</html>
