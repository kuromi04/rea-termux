<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>REA Obsidian Matrix 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05060b;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    #3d-graph { width: 100%; height: 100%; position: absolute; top:0; left:0; }

    /* Barra Superior Unificada (Navbar HUD) */
    .top-navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: linear-gradient(180deg, rgba(5, 6, 11, 0.95) 0%, rgba(5, 6, 11, 0.75) 70%, rgba(5, 6, 11, 0) 100%);
      pointer-events: none;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: auto;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00f3ff;
      box-shadow: 0 0 10px #00f3ff;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }
    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #f8fafc;
      white-space: nowrap;
    }
    .brand-sub {
      font-size: 10px;
      color: #64748b;
      letter-spacing: 0.8px;
      margin-left: 15px;
    }

    /* Controles de Acción (Búsqueda + Botones) */
    .controls-section {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .search-input {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 7px 12px;
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
      outline: none;
      backdrop-filter: blur(12px);
      width: 170px;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      width: 220px;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #94a3b8;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .hud-btn:hover {
      color: #f8fafc;
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.9);
    }
    .hud-btn.active {
      background: rgba(14, 165, 233, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* Leyenda Obsidian Inferior */
    .legend {
      position: absolute;
      left: 16px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 11px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .legend-item:hover { opacity: 1; }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      box-shadow: 0 0 6px currentColor;
    }

    /* Panel de Comandos Detallado */
    .node-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 650px;
      background: rgba(11, 15, 26, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 18px 22px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(14, 165, 233, 0.15);
      z-index: 30;
      display: none;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translate(-50%, 15px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .panel-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-close-panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-close-panel:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      color: #fca5a5;
    }
    .panel-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: bold;
      color: #f8fafc;
      font-family: monospace;
      letter-spacing: 0.5px;
    }
    .panel-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .cmd-container { display: flex; flex-direction: column; gap: 8px; }
    .cmd-input-group { display: flex; gap: 6px; align-items: center; }
    .cmd-input {
      flex: 1;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 13px;
      color: #38bdf8;
      outline: none;
    }
    .cmd-input:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
    .btn-action {
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-copy { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .btn-copy:hover { background: #0ea5e9; }
    .btn-help { background: linear-gradient(135deg, #6366f1, #4f46e5); }
    .btn-help:hover { background: #818cf8; }
    .btn-exec { background: linear-gradient(135deg, #059669, #047857); }
    .btn-exec:hover { background: #10b981; }

    /* Output Console */
    .terminal-output {
      margin-top: 10px;
      background: #000000;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: monospace;
      font-size: 12px;
      color: #4ade80;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
    }

    /* Adaptación móvil estricta (no solapamiento) */
    @media (max-width: 768px) {
      .top-navbar {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 8px 12px;
        background: rgba(5, 6, 11, 0.92);
        backdrop-filter: blur(12px);
      }
      .brand-section {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .brand-sub { margin-left: 0; }
      .controls-section {
        width: 100%;
        justify-content: space-between;
      }
      .search-input {
        flex: 1;
        width: auto;
      }
      .search-input:focus { width: auto; }
      .legend { display: none; }
      .cmd-input-group { flex-wrap: wrap; }
      .cmd-input { width: 100%; flex: auto; }
    }
  </style>
  <script src="./assets/three.min.js"></script>
  <script src="./assets/3d-force-graph.min.js"></script>
</head>
<body>

  <!-- Barra Superior Unificada Anti-Solapamiento -->
  <header class="top-navbar">
    <div class="brand-section">
      <div class="brand-row">
        <div class="hud-badge-dot"></div>
        <span class="brand-title">REA 3D MATRIX</span>
      </div>
      <span class="brand-sub">168 Nodos de Inteligencia Táctica</span>
    </div>

    <div class="controls-section">
      <input type="text" class="search-input" id="search-input" placeholder="Buscar comando..." autocomplete="off">
      <button class="hud-btn active" id="btn-orbit" onclick="toggleOrbit()">
        <span>🔄</span><span>Órbita</span>
      </button>
      <button class="hud-btn" onclick="resetCamera()">
        <span>🎯</span><span>Centro</span>
      </button>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item" onclick="focusCluster('CORE')"><div class="legend-dot" style="background:#00f3ff; color:#00f3ff;"></div><span>Core & Engine</span></div>
    <div class="legend-item" onclick="focusCluster('ANDROID')"><div class="legend-dot" style="background:#00ff88; color:#00ff88;"></div><span>Android & ADB</span></div>
    <div class="legend-item" onclick="focusCluster('BINARY')"><div class="legend-dot" style="background:#ff0055; color:#ff0055;"></div><span>Native & Binary</span></div>
    <div class="legend-item" onclick="focusCluster('WEB_JS')"><div class="legend-dot" style="background:#ffe600; color:#ffe600;"></div><span>Web & JavaScript</span></div>
    <div class="legend-item" onclick="focusCluster('MANAGED')"><div class="legend-dot" style="background:#b537f2; color:#b537f2;"></div><span>Managed & WASM</span></div>
    <div class="legend-item" onclick="focusCluster('ENV')"><div class="legend-dot" style="background:#ff8800; color:#ff8800;"></div><span>Agent Environments</span></div>
  </div>

  <div id="3d-graph"></div>

  <div class="node-panel" id="node-panel">
    <div class="panel-header">
      <div class="panel-header-left">
        <span class="panel-title" id="panel-title">rea analyze</span>
        <span class="panel-tag" id="panel-tag" style="background:#00f3ff; color:#000;">CORE</span>
      </div>
      <button class="btn-close-panel" onclick="closePanel()" title="Cerrar widget">✕</button>
    </div>
    <div class="panel-desc" id="panel-desc">Get an overview of an app</div>
    
    <div class="cmd-container">
      <div class="cmd-input-group">
        <input type="text" class="cmd-input" id="cmd-input" value="rea analyze" placeholder="Escribe el comando o argumentos...">
        <button class="btn-action btn-copy" onclick="copyCommand()">Copiar</button>
        <button class="btn-action btn-help" onclick="triggerHelp()">--help</button>
        <button class="btn-action btn-exec" id="exec-btn" onclick="triggerExecution()">Ejecutar</button>
      </div>
      <div class="terminal-output" id="term-output"></div>
    </div>
  </div>

  <script>
    let graphData = null;
    let Graph = null;
    let isOrbiting = true;
    let isInteracting = false;
    let angle = 0;
    let isTabVisible = true;

    const clusterColors = {
      CORE: '#00f3ff',
      ANDROID: '#00ff88',
      BINARY: '#ff0055',
      WEB_JS: '#ffe600',
      MANAGED: '#b537f2',
      ENV: '#ff8800',
      ROOT: '#ffffff'
    };

    fetch('./graph-data.json')
      .then(res => res.json())
      .then(data => {
        graphData = data;
        initObsidianGraph(data);
      });

    document.addEventListener('visibilitychange', () => {
      isTabVisible = !document.hidden;
      if (Graph) {
        if (!isTabVisible) Graph.pauseAnimation();
        else Graph.resumeAnimation();
      }
    });

    function initObsidianGraph(gData) {
      const elem = document.getElementById('3d-graph');
      
      Graph = ForceGraph3D()(elem)
        .graphData(gData)
        .backgroundColor('#05060b')
        .showNavInfo(false)
        .nodeThreeObject(node => {
          const group = new THREE.Group();
          
          const isCluster = node.isCluster;
          const radius = isCluster ? (node.category === 'ROOT' ? 9 : 6) : 3.2;
          const colorHex = node.color || clusterColors[node.category] || '#38bdf8';

          const geometry = new THREE.SphereGeometry(radius, 16, 16);
          const material = new THREE.MeshLambertMaterial({
            color: new THREE.Color(colorHex),
            emissive: new THREE.Color(colorHex),
            emissiveIntensity: isCluster ? 0.6 : 0.25,
            roughness: 0.3,
            metalness: 0.8
          });
          const sphere = new THREE.Mesh(geometry, material);
          group.add(sphere);

          if (isCluster) {
            const ringGeo = new THREE.RingGeometry(radius * 1.35, radius * 1.5, 24);
            const ringMat = new THREE.MeshBasicMaterial({
              color: new THREE.Color(colorHex),
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 0.5
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            group.add(ring);
          }

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const fontSize = isCluster ? 28 : 20;
          canvas.width = 512;
          canvas.height = 64;
          ctx.font = `600 ${fontSize}px "JetBrains Mono", -apple-system, sans-serif`;
          ctx.fillStyle = isCluster ? '#ffffff' : '#cbd5e1';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(node.name, 256, 32);

          const texture = new THREE.CanvasTexture(canvas);
          texture.minFilter = THREE.LinearFilter;
          const spriteMat = new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            opacity: isCluster ? 0.95 : 0.75,
            depthWrite: false
          });
          const sprite = new THREE.Sprite(spriteMat);
          sprite.scale.set(isCluster ? 45 : 30, isCluster ? 7 : 4.5, 1);
          sprite.position.y = radius + (isCluster ? 5 : 3.5);
          group.add(sprite);

          return group;
        })
        .linkColor(link => link.color || 'rgba(148, 163, 184, 0.15)')
        .linkWidth(link => link.source.id === 'REA_ROOT' ? 1.8 : 0.8)
        .linkOpacity(0.25)
        .linkDirectionalParticles(link => link.source.id === 'REA_ROOT' ? 3 : 1)
        .linkDirectionalParticleWidth(1.2)
        .linkDirectionalParticleSpeed(0.003)
        .warmupTicks(60)
        .cooldownTicks(90)
        .cooldownTime(3500)
        .d3VelocityDecay(0.35)
        .onNodeClick(node => {
          selectNode(node);
        })
        .onBackgroundClick(() => {
          closePanel();
        });

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      Graph.scene().add(ambientLight);

      const pointLight = new THREE.PointLight(0x00f3ff, 1.5, 600);
      pointLight.position.set(0, 100, 200);
      Graph.scene().add(pointLight);

      setInterval(() => {
        if (isOrbiting && !isInteracting && isTabVisible && Graph) {
          Graph.cameraPosition({
            x: 520 * Math.sin(angle),
            z: 520 * Math.cos(angle)
          });
          angle += Math.PI / 1800;
        }
      }, 35);

      const stopOrbitTemporarily = () => {
        isInteracting = true;
        clearTimeout(window._interactTimer);
        window._interactTimer = setTimeout(() => { isInteracting = false; }, 5000);
      };

      window.addEventListener('mousedown', stopOrbitTemporarily);
      window.addEventListener('touchstart', stopOrbitTemporarily);

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        if (!val) return;
        const found = gData.nodes.find(n => n.name.toLowerCase().includes(val) || (n.desc && n.desc.toLowerCase().includes(val)));
        if (found) {
          selectNode(found);
        }
      });
    }

    function selectNode(node) {
      isInteracting = true;
      const panel = document.getElementById('node-panel');
      const title = document.getElementById('panel-title');
      const tag = document.getElementById('panel-tag');
      const desc = document.getElementById('panel-desc');
      const cmdInput = document.getElementById('cmd-input');
      const termOutput = document.getElementById('term-output');

      termOutput.style.display = 'none';
      termOutput.innerText = '';
      panel.style.display = 'block';

      title.innerText = node.name;
      tag.innerText = node.category || 'NODE';
      tag.style.backgroundColor = node.color || clusterColors[node.category] || '#38bdf8';
      desc.innerText = node.desc || 'Sin descripción';

      if (node.isCluster) {
        cmdInput.value = "rea --help";
        cmdInput.disabled = true;
        document.getElementById("exec-btn").disabled = true;
        document.querySelector(".btn-copy").style.display = "none";
        document.querySelector(".btn-help").style.display = "none";
      } else {
        cmdInput.value = node.cmd || `rea ${node.id}`;
        cmdInput.disabled = false;
        document.getElementById("exec-btn").disabled = false;
        document.querySelector(".btn-copy").style.display = "inline-block";
        document.querySelector(".btn-help").style.display = "inline-block";
      }

      const distance = node.isCluster ? 180 : 100;
      const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
      Graph.cameraPosition(
        { x: node.x * distRatio, y: node.y * distRatio + 15, z: node.z * distRatio },
        node,
        1200
      );
    }

    function focusCluster(clusterId) {
      if (!graphData) return;
      const clusterNode = graphData.nodes.find(n => n.id === clusterId);
      if (clusterNode) selectNode(clusterNode);
    }

    function toggleOrbit() {
      isOrbiting = !isOrbiting;
      const btn = document.getElementById('btn-orbit');
      btn.classList.toggle('active', isOrbiting);
    }

    function resetCamera() {
      if (!Graph) return;
      isInteracting = false;
      Graph.cameraPosition({ x: 0, y: 100, z: 520 }, { x: 0, y: 0, z: 0 }, 1000);
    }

    function closePanel() {
      const panel = document.getElementById("node-panel");
      panel.style.display = "none";
      isInteracting = false;
    }

    function copyCommand() {
      const text = document.getElementById('cmd-input').value;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.innerText = '¡Copiado!';
        setTimeout(() => { btn.innerText = 'Copiar'; }, 1500);
      });
    }

    function triggerHelp() {
      const cmdInput = document.getElementById('cmd-input');
      const baseCmd = cmdInput.value.split(' ')[0] + ' ' + (cmdInput.value.split(' ')[1] || '');
      cmdInput.value = baseCmd.trim() + ' --help';
      triggerExecution();
    }

    function triggerExecution() {
      const text = document.getElementById('cmd-input').value.trim();
      const outputElem = document.getElementById('term-output');
      const execBtn = document.getElementById('exec-btn');

      outputElem.style.display = 'block';
      outputElem.innerText = `⏳ Ejecutando en Termux: ${text}...`;
      execBtn.disabled = true;
      execBtn.innerText = 'Corriendo...';

      fetch(`/run?cmd=${encodeURIComponent(text)}`)
        .then(r => r.json())
        .then(d => {
          outputElem.innerText = d.output || 'Ejecutado sin salida.';
        })
        .catch(err => {
          outputElem.innerText = '❌ Error de comunicación con el servidor Termux: ' + err.message;
        })
        .finally(() => {
          execBtn.disabled = false;
          execBtn.innerText = 'Ejecutar';
        });
    }
  </script>
</body>
</html>
